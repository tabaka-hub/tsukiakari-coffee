<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="ペンダントライトが灯るカウンター席のイラスト">
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="#33271f"/>
  <rect y="330" width="600" height="70" fill="#231a15"/>

  <!-- 棚 -->
  <g fill="#7a4f33">
    <rect x="60" y="130" width="480" height="8"/>
    <rect x="60" y="200" width="480" height="8"/>
  </g>
  <!-- 上段：豆の瓶 -->
  <g>
    <g fill="#c9b79a" opacity=".85">
      <rect x="85" y="92" width="26" height="38" rx="4"/>
      <rect x="121" y="92" width="26" height="38" rx="4"/>
      <rect x="157" y="92" width="26" height="38" rx="4"/>
      <rect x="420" y="92" width="26" height="38" rx="4"/>
      <rect x="456" y="92" width="26" height="38" rx="4"/>
    </g>
    <g fill="#4a2f1f">
      <rect x="88" y="106" width="20" height="22" rx="2"/>
      <rect x="124" y="100" width="20" height="28" rx="2"/>
      <rect x="160" y="112" width="20" height="16" rx="2"/>
      <rect x="423" y="103" width="20" height="25" rx="2"/>
      <rect x="459" y="109" width="20" height="19" rx="2"/>
    </g>
    <!-- 観葉植物 -->
    <rect x="286" y="108" width="28" height="22" rx="3" fill="#b5694a"/>
    <g fill="#5f8a5a">
      <ellipse cx="290" cy="96" rx="8" ry="16" transform="rotate(-25 290 96)"/>
      <ellipse cx="300" cy="90" rx="8" ry="18"/>
      <ellipse cx="310" cy="96" rx="8" ry="16" transform="rotate(25 310 96)"/>
    </g>
  </g>
  <!-- 下段：カップ -->
  <g fill="#f6f1e7">
    <rect x="90" y="180" width="24" height="20" rx="3"/>
    <rect x="124" y="180" width="24" height="20" rx="3"/>
    <rect x="158" y="180" width="24" height="20" rx="3"/>
    <rect x="192" y="180" width="24" height="20" rx="3"/>
    <rect x="384" y="180" width="24" height="20" rx="3"/>
    <rect x="418" y="180" width="24" height="20" rx="3"/>
    <rect x="452" y="180" width="24" height="20" rx="3"/>
    <rect x="486" y="180" width="24" height="20" rx="3"/>
  </g>
  <!-- ケトル -->
  <g fill="#b8bcc4">
    <rect x="272" y="170" width="44" height="30" rx="6"/>
    <path d="M316 180 q22 -2 26 -18 l5 2 q-4 22 -31 26z"/>
    <rect x="286" y="164" width="16" height="6" rx="2"/>
  </g>

  <!-- ペンダントライト -->
  <g>
    <circle cx="150" cy="78" r="95" fill="url(#glow)"/>
    <circle cx="300" cy="78" r="95" fill="url(#glow)"/>
    <circle cx="450" cy="78" r="95" fill="url(#glow)"/>
    <g stroke="#15100d" stroke-width="2">
      <line x1="150" y1="0" x2="150" y2="48"/>
      <line x1="300" y1="0" x2="300" y2="48"/>
      <line x1="450" y1="0" x2="450" y2="48"/>
    </g>
    <g fill="#15100d">
      <path d="M138 48h24l14 24h-52z"/>
      <path d="M288 48h24l14 24h-52z"/>
      <path d="M438 48h24l14 24h-52z"/>
    </g>
    <g fill="#ffe7a3">
      <ellipse cx="150" cy="74" rx="10" ry="5"/>
      <ellipse cx="300" cy="74" rx="10" ry="5"/>
      <ellipse cx="450" cy="74" rx="10" ry="5"/>
    </g>
  </g>

  <!-- カウンター -->
  <rect x="30" y="262" width="540" height="16" rx="2" fill="#a8704a"/>
  <rect x="42" y="278" width="516" height="62" fill="#5c3c28"/>
  <g stroke="#4a2f1f" stroke-width="2">
    <line x1="171" y1="278" x2="171" y2="340"/>
    <line x1="300" y1="278" x2="300" y2="340"/>
    <line x1="429" y1="278" x2="429" y2="340"/>
  </g>

  <!-- ドリッパーとサーバー -->
  <g>
    <path d="M214 214h36l-10 22h-16z" fill="#f6f1e7"/>
    <rect x="210" y="236" width="44" height="4" fill="#15100d"/>
    <path d="M218 240h28l4 22h-36z" fill="#c9b79a" opacity=".7"/>
    <path d="M216 250h32l2 12h-36z" fill="#3b2416"/>
  </g>
  <!-- カップ＆ソーサー -->
  <g>
    <ellipse cx="380" cy="261" rx="24" ry="4" fill="#e6dcc8"/>
    <path d="M366 244h28v10a8 8 0 0 1-8 8h-12a8 8 0 0 1-8-8z" fill="#f6f1e7"/>
    <path d="M394 247h5a4 4 0 0 1 0 9h-5" fill="none" stroke="#f6f1e7" stroke-width="3"/>
    <g fill="none" stroke="#f6f1e7" stroke-width="2" stroke-linecap="round" opacity=".5">
      <path d="M374 236q-5-8 0-14"/>
      <path d="M385 236q5-8 0-16"/>
    </g>
  </g>

  <!-- スツール -->
  <g>
    <g stroke="#15100d" stroke-width="4" stroke-linecap="round">
      <path d="M96 318l-8 66M134 318l8 66M92 356h46"/>
      <path d="M226 318l-8 66M264 318l8 66M222 356h46"/>
      <path d="M356 318l-8 66M394 318l8 66M352 356h46"/>
      <path d="M486 318l-8 66M524 318l8 66M482 356h46"/>
    </g>
    <g fill="#8c3b2e">
      <rect x="86" y="306" width="58" height="14" rx="7"/>
      <rect x="216" y="306" width="58" height="14" rx="7"/>
      <rect x="346" y="306" width="58" height="14" rx="7"/>
      <rect x="476" y="306" width="58" height="14" rx="7"/>
    </g>
  </g>
</svg>
