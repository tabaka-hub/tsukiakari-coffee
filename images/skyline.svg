<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- 窓あかり（手前のビル用） -->
    <pattern id="win" width="60" height="66" patternUnits="userSpaceOnUse">
      <g fill="#f2cf7a">
        <rect x="5" y="8" width="8" height="11" opacity=".95"/>
        <rect x="45" y="8" width="8" height="11" opacity=".4"/>
        <rect x="5" y="30" width="8" height="11" opacity=".2"/>
        <rect x="25" y="30" width="8" height="11" opacity=".85"/>
        <rect x="5" y="52" width="8" height="11" opacity=".6"/>
        <rect x="45" y="52" width="8" height="11" opacity=".9"/>
      </g>
    </pattern>
    <!-- 窓あかり（奥のビル用） -->
    <pattern id="win-far" width="34" height="38" patternUnits="userSpaceOnUse">
      <g fill="#f2cf7a">
        <rect x="6" y="6" width="4" height="6" opacity=".45"/>
        <rect x="22" y="24" width="4" height="6" opacity=".3"/>
        <rect x="22" y="6" width="4" height="6" opacity=".12"/>
      </g>
    </pattern>

    <g id="far">
      <rect x="0" y="170" width="70" height="150"/>
      <rect x="70" y="120" width="60" height="200"/>
      <rect x="130" y="190" width="90" height="130"/>
      <rect x="220" y="90" width="50" height="230"/>
      <rect x="270" y="150" width="80" height="170"/>
      <rect x="350" y="200" width="60" height="120"/>
      <rect x="410" y="110" width="70" height="210"/>
      <rect x="480" y="170" width="90" height="150"/>
      <rect x="570" y="60" width="46" height="260"/>
      <rect x="616" y="140" width="84" height="180"/>
      <rect x="700" y="190" width="70" height="130"/>
      <rect x="770" y="100" width="60" height="220"/>
      <rect x="830" y="160" width="90" height="160"/>
      <rect x="920" y="200" width="60" height="120"/>
      <rect x="980" y="80" width="54" height="240"/>
      <rect x="1034" y="150" width="86" height="170"/>
      <rect x="1120" y="180" width="80" height="140"/>
    </g>
    <g id="near">
      <rect x="0" y="230" width="90" height="90"/>
      <rect x="100" y="200" width="70" height="120"/>
      <rect x="180" y="250" width="100" height="70"/>
      <rect x="290" y="180" width="64" height="140"/>
      <rect x="360" y="240" width="110" height="80"/>
      <rect x="480" y="215" width="80" height="105"/>
      <rect x="570" y="255" width="90" height="65"/>
      <rect x="670" y="190" width="70" height="130"/>
      <rect x="750" y="235" width="100" height="85"/>
      <rect x="860" y="205" width="76" height="115"/>
      <rect x="946" y="250" width="104" height="70"/>
      <rect x="1060" y="185" width="60" height="135"/>
      <rect x="1126" y="240" width="74" height="80"/>
    </g>
  </defs>

  <!-- 奥のビル群 -->
  <use href="#far" fill="#1d2850"/>
  <use href="#far" fill="url(#win-far)"/>
  <g stroke="#1d2850" stroke-width="3">
    <line x1="593" y1="24" x2="593" y2="60"/>
    <line x1="1007" y1="52" x2="1007" y2="80"/>
    <line x1="245" y1="70" x2="245" y2="90"/>
  </g>
  <g fill="#e2574c">
    <circle cx="593" cy="24" r="3"/>
    <circle cx="1007" cy="52" r="2.5"/>
  </g>

  <!-- 手前のビル群 -->
  <use href="#near" fill="#090d1b"/>
  <use href="#near" fill="url(#win)"/>
  <rect x="0" y="296" width="1200" height="24" fill="#090d1b"/>
</svg>
